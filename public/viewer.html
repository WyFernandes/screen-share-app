<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Assistindo Transmissão</title>

<style>

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background: #0f172a;
  color: #f1f5f9;

  margin: 0;
  padding: 1.5rem;

  display: flex;
  flex-direction: column;
  align-items: center;
}

.badge {
  background: #1e293b;

  padding: 0.5rem 1rem;

  border-radius: 8px;

  font-size: 0.9rem;

  margin-bottom: 1rem;
}

video {
  width: 100%;

  max-width: 1100px;

  max-height: 80vh;

  background: black;

  border-radius: 12px;
}

.status {
  color: #94a3b8;

  font-size: 0.9rem;

  margin-top: 1rem;

  text-align: center;
}

button {
  margin-top: 0.75rem;

  padding: 0.6rem 1.2rem;

  border: none;

  border-radius: 8px;

  background: #6366f1;

  color: white;

  font-weight: 600;

  cursor: pointer;
}

</style>

</head>


<body>

<div class="badge">

  Sala:
  <strong id="roomLabel"></strong>

</div>


<video
  id="remoteVideo"
  autoplay
  playsinline
  controls
  muted
></video>


<button
  id="unmuteBtn"
  style="display:none"
>
  🔊 Ativar som
</button>


<p
  class="status"
  id="status"
>
  Conectando ao servidor...
</p>


<script src="/socket.io/socket.io.js"></script>


<script>

const params =
  new URLSearchParams(window.location.search);


const room =
  params.get('room') || 'sala-padrao';


document
  .getElementById('roomLabel')
  .textContent = room;


/*
SOCKET
*/

const socket = io({
  transports: ['websocket', 'polling'],
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000,
  reconnectionDelayMax: 5000
});


let pc = null;

let broadcasterId = null;

let iceServersCache = null;

let pendingCandidates = [];


/*
STATUS
*/

function setStatus(message) {

  document
    .getElementById('status')
    .textContent = message;

}


/*
CONECTOU AO SERVIDOR
*/

socket.on('connect', () => {

  console.log(
    '[SOCKET] Conectado:',
    socket.id
  );


  setStatus(
    'Procurando transmissão...'
  );


  /*
  Solicita transmissão.
  */

  socket.emit(
    'watcher',
    room
  );

});


socket.on('disconnect', () => {

  setStatus(
    'Conexão com o servidor perdida. Reconectando...'
  );

});


socket.on('connect_error', error => {

  console.error(
    '[SOCKET] Erro:',
    error
  );


  setStatus(
    'Não foi possível conectar ao servidor.'
  );

});


/*
TURN
*/

async function getIceServers() {

  const fallback = [
    {
      urls:
        'stun:stun.l.google.com:19302'
    },
    {
      urls:
        'stun:stun1.l.google.com:19302'
    }
  ];


  try {

    const response =
      await fetch(
        '/api/turn-credentials'
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const servers =
      await response.json();


    console.log(
      '[ICE] Servidores recebidos:',
      servers
    );


    return [
      ...fallback,
      ...servers
    ];

  } catch (error) {

    console.warn(
      '[ICE] TURN indisponível. Usando STUN.',
      error
    );


    return fallback;

  }

}


getIceServers()
  .then(servers => {

    iceServersCache = servers;

  });


/*
SEM TRANSMISSOR
*/

let retryInterval = null;


socket.on(
  'no-broadcaster',
  () => {

    setStatus(
      'Nenhuma transmissão ativa nesta sala. Aguardando o transmissor...'
    );


    if (!retryInterval) {

      retryInterval =
        setInterval(
          () => {

            if (
              !pc &&
              socket.connected
            ) {

              socket.emit(
                'watcher',
                room
              );

            }

          },
          3000
        );

    }

  }
);


/*
TRANSMISSOR ENTROU
*/

socket.on(
  'broadcaster-ready',
  () => {

    console.log(
      '[BROADCASTER] Disponível.'
    );


    setStatus(
      'Transmissão encontrada. Conectando...'
    );


    if (
      !pc &&
      socket.connected
    ) {

      socket.emit(
        'watcher',
        room
      );

    }

  }
);


/*
OFFER
*/

socket.on(
  'offer',
  async (senderId, offer) => {

    console.log(
      '[WEBRTC] Offer recebida:',
      senderId
    );


    /*
    Limpa tentativa anterior.
    */

    if (pc) {

      pc.close();

      pc = null;

    }


    if (retryInterval) {

      clearInterval(
        retryInterval
      );

      retryInterval = null;

    }


    broadcasterId = senderId;

    pendingCandidates = [];


    setStatus(
      'Estabelecendo conexão...'
    );


    if (!iceServersCache) {

      iceServersCache =
        await getIceServers();

    }


    pc =
      new RTCPeerConnection({
        iceServers: iceServersCache
      });


    /*
    RECEBIMENTO DO VÍDEO
    */

    pc.ontrack =
      event => {

        console.log(
          '[WEBRTC] Stream recebida.'
        );


        const video =
          document.getElementById(
            'remoteVideo'
          );


        const stream =
          event.streams[0];


        video.srcObject = stream;


        video.play()
          .catch(error => {

            console.warn(
              '[VIDEO] Autoplay bloqueado:',
              error
            );

          });


        setStatus(
          'Conectado! Assistindo à transmissão.'
        );


        const hasAudio =
          stream.getAudioTracks().length > 0;


        if (hasAudio) {

          document
            .getElementById('unmuteBtn')
            .style.display =
              'inline-block';

        }

      };


    /*
    ENVIO DOS ICE CANDIDATES
    */

    pc.onicecandidate =
      event => {

        if (
          event.candidate &&
          broadcasterId
        ) {

          socket.emit(
            'candidate',
            broadcasterId,
            event.candidate
          );

        }

      };


    /*
    ESTADO WEBRTC
    */

    pc.onconnectionstatechange =
      () => {

        console.log(
          '[WEBRTC] Estado:',
          pc.connectionState
        );


        switch (
          pc.connectionState
        ) {

          case 'connecting':

            setStatus(
              'Estabelecendo conexão...'
            );

            break;


          case 'connected':

            setStatus(
              'Conectado! Assistindo à transmissão.'
            );

            break;


          case 'disconnected':

            setStatus(
              'Conexão interrompida. Tentando recuperar...'
            );

            break;


          case 'failed':

            setStatus(
              'Falha na conexão WebRTC. Verifique o TURN ou tente novamente.'
            );

            cleanupPeer();

            break;


          case 'closed':

            break;

        }

      };


    try {

      /*
      Define offer do broadcaster.
      */

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );


      /*
      Adiciona candidates que chegaram
      antes da RemoteDescription.
      */

      for (
        const candidate
        of pendingCandidates
      ) {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      }


      pendingCandidates = [];


      /*
      Cria answer.
      */

      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      socket.emit(
        'answer',
        broadcasterId,
        pc.localDescription
      );


      console.log(
        '[WEBRTC] Answer enviada.'
      );


    } catch (error) {

      console.error(
        '[WEBRTC] Erro:',
        error
      );


      setStatus(
        `Erro ao conectar: ${error.message}`
      );

      cleanupPeer();

    }

  }
);


/*
ICE CANDIDATE
*/

socket.on(
  'candidate',
  async (senderId, candidate) => {

    /*
    Ignora candidate de outro broadcaster.
    */

    if (
      broadcasterId &&
      senderId !== broadcasterId
    ) {

      return;

    }


    /*
    Se o PeerConnection ainda não existe,
    guarda o candidate.
    */

    if (!pc) {

      pendingCandidates.push(
        candidate
      );

      return;

    }


    /*
    Se RemoteDescription ainda não foi definida,
    guarda.
    */

    if (
      !pc.remoteDescription
    ) {

      pendingCandidates.push(
        candidate
      );

      return;

    }


    try {

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    } catch (error) {

      console.warn(
        '[ICE] Erro:',
        error
      );

    }

  }
);


/*
TRANSMISSOR DESCONECTOU
*/

socket.on(
  'broadcaster-disconnect',
  () => {

    setStatus(
      'O transmissor encerrou a transmissão.'
    );


    cleanupPeer();


    document
      .getElementById('remoteVideo')
      .srcObject = null;


    document
      .getElementById('unmuteBtn')
      .style.display = 'none';


    broadcasterId = null;

  }
);


/*
ATIVAR SOM
*/

document
  .getElementById('unmuteBtn')
  .addEventListener(
    'click',
    async () => {

      const video =
        document.getElementById(
          'remoteVideo'
        );


      video.muted = false;


      try {

        await video.play();

      } catch (error) {

        console.warn(
          error
        );

      }


      document
        .getElementById('unmuteBtn')
        .style.display = 'none';

    }
  );


/*
LIMPEZA DO PEER
*/

function cleanupPeer() {

  if (pc) {

    pc.ontrack = null;
    pc.onicecandidate = null;

    pc.close();

    pc = null;

  }

}


/*
SAIU DA PÁGINA
*/

window.addEventListener(
  'beforeunload',
  () => {

    cleanupPeer();

  }
);

</script>

</body>
</html>
