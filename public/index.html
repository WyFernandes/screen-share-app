<script>

function getRoom() {

  const el =
    document.getElementById("room");

  let room =
    el.value.trim();

  if (!room) {

    room =
      Math.random()
        .toString(36)
        .substring(2, 8);

  }

  room =
    room.replace(
      /[^a-zA-Z0-9_-]/g,
      ""
    );


  if (!room) {

    room = "sala-padrao";

  }


  return room;

}


function goBroadcast() {

  const room =
    getRoom();

  window.location.href =
    `/broadcaster.html?room=${encodeURIComponent(room)}`;

}


function goWatch() {

  const room =
    getRoom();

  window.location.href =
    `/viewer.html?room=${encodeURIComponent(room)}`;

}

</script>
