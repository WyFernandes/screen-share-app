<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transmitindo Tela</title>

<style>
body {
  font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #0f172a;
  color: #f1f5f9;
  margin: 0;
  padding: 1.5rem;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.badge {
  background: #1e293b;
  padding: 0.5rem 1rem;
  border-radius: 8px;
}

.link-box {
  background: #1e293b;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  display: flex;
  gap: 0.5rem;
  align-items: center;
  flex: 1;
  min-width: 260px;
}

.link-box input {
  flex: 1;
  background: transparent;
  border: none;
  color: #f1f5f9;
}

button {
  padding: 0.6rem 1rem;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  background: #6366f1;
  color: white;
}

#startBtn {
  background: #16a34a;
}

#stopBtn {
  background: #dc2626;
}

video {
  width: 100%;
  max-height: 70vh;
  background: black;
  border-radius: 12px;
  margin-top: 1rem;
}

.status {
  color: #94a3b8;
  font-size: 0.85rem;
  margin-top: 0.5rem;
}

.debug {
  white-space: pre-wrap;
  font-family: monospace;
  background: #020617;
  padding: 1rem;
  border-radius: 8px;
  margin-top: 1rem;
  color: #cbd5e1;
}
</style>
</head>

<body>

<div class="top">

  <div class="badge">
    Sala:
    <strong id="roomLabel"></strong>
  </div>

  <div class="link-box">
    <input id="shareLink" readonly>
    <button onclick="copyLink()">Copiar link</button>
  </div>

  <div>
    <button id="startBtn" onclick="startShare()">
      Iniciar transmissão
    </button>

    <button id="stopBtn"
            onclick="stopShare()"
            style="display:none">
      Parar
    </button>
  </div>

</div>

<video
  id="preview"
  autoplay
  muted
  playsinline>
</video>

<p class="status" id="status">
  Clique em "Iniciar transmissão".
</p>

<p class="status" id="viewerCount">
  Espectadores conectados: 0
</p>

<div class="debug" id="debug">
Aguardando...
</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const params =
  new URLSearchParams(window.location.search);

const room =
  params.get("room") || "sala-padrao";

document.getElementById("roomLabel").textContent =
  room;


const viewerUrl =
  `${window.location.origin}/viewer.html?room=${encodeURIComponent(room)}`;

document.getElementById("shareLink").value =
  viewerUrl;


function copyLink() {

  navigator.clipboard.writeText(viewerUrl);

  document.getElementById("status").textContent =
    "Link copiado!";

}


const socket = io({
  transports: ["websocket", "polling"]
});


const peers = {};

let localStream = null;

let iceServersCache = null;


function debug(message) {

  console.log("[BROADCASTER]", message);

  const el =
    document.getElementById("debug");

  el.textContent +=
    "\n" + message;
}


function setStatus(message) {

  document.getElementById("status").textContent =
    message;

}


/*
============================================================
OBTER TURN DO SERVIDOR
============================================================
*/
async function getIceServers() {
  try {
    const response = await fetch('/api/turn-credentials');

    if (!response.ok) {
      throw new Error(
        `Servidor TURN respondeu HTTP ${response.status}`
      );
    }

    const iceServers = await response.json();

    console.log('ICE servers recebidos:', iceServers);

    return iceServers;

  } catch (error) {

    console.error(
      'Erro ao obter servidores TURN:',
      error
    );

    return [
      {
        urls: 'stun:stun.l.google.com:19302'
      }
    ];
  }
}


/*
============================================================
INICIALIZAÇÃO TURN
============================================================
*/

async function initializeIceServers() {

  if (!iceServersCache) {

    iceServersCache =
      await getIceServers();

  }

  return iceServersCache;
}


/*
============================================================
SOCKET
============================================================
*/

socket.on("connect", () => {

  debug(
    "Socket.IO conectado: " +
    socket.id
  );

  if (localStream) {

    socket.emit(
      "broadcaster",
      room
    );

  }

});


socket.on("connect_error", (error) => {

  debug(
    "Socket.IO erro: " +
    error.message
  );

});


/*
============================================================
INICIAR TRANSMISSÃO
============================================================
*/

async function startShare() {

  try {

    setStatus(
      "Solicitando captura da tela..."
    );

    await initializeIceServers();

    localStream =
      await navigator.mediaDevices.getDisplayMedia({

        video: {
          frameRate: {
            ideal: 30,
            max: 30
          }
        },

        audio: true

      });


    document.getElementById("preview").srcObject =
      localStream;


    document.getElementById("startBtn")
      .style.display = "none";

    document.getElementById("stopBtn")
      .style.display = "inline-block";


    setStatus(
      "Transmitindo. Compartilhe o link."
    );


    const videoTrack =
      localStream.getVideoTracks()[0];

    if (videoTrack) {

      videoTrack.addEventListener(
        "ended",
        stopShare
      );

    }


    socket.emit(
      "broadcaster",
      room
    );


    debug(
      "Broadcaster registrado na sala " +
      room
    );


  } catch (error) {

    console.error(error);

    debug(
      "Erro ao iniciar: " +
      error.message
    );

    setStatus(
      "Erro: " + error.message
    );

  }

}


/*
============================================================
NOVO ESPECTADOR
============================================================
*/

socket.on("watcher", async (watcherId) => {

  debug(
    "Novo watcher: " +
    watcherId
  );

  if (!localStream) {

    debug(
      "Watcher ignorado: não há stream."
    );

    return;
  }


  try {

    const iceServers =
      await initializeIceServers();


    const pc =
      new RTCPeerConnection({
        iceServers,
        iceTransportPolicy: "all"
      });


    peers[watcherId] = pc;


    updateViewerCount();


    /*
      Adiciona as tracks da tela.
    */

    localStream.getTracks().forEach(
      track => {

        pc.addTrack(
          track,
          localStream
        );

      }
    );


    /*
      ICE candidates.
    */

    pc.onicecandidate = event => {

      if (event.candidate) {

        socket.emit(
          "candidate",
          watcherId,
          event.candidate
        );

      }

    };


    /*
      Estado ICE.
    */

    pc.oniceconnectionstatechange = () => {

      debug(
        `Watcher ${watcherId} ICE: ` +
        pc.iceConnectionState
      );

    };


    pc.onconnectionstatechange = () => {

      debug(
        `Watcher ${watcherId} connection: ` +
        pc.connectionState
      );

    };


    /*
      Cria OFFER.
    */

    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    debug(
      "Offer criada para " +
      watcherId
    );


    socket.emit(
      "offer",
      watcherId,
      pc.localDescription
    );


  } catch (error) {

    console.error(error);

    debug(
      "Erro criando peer: " +
      error.message
    );

  }

});


/*
============================================================
ANSWER
============================================================
*/

socket.on(
  "answer",
  async (watcherId, answer) => {

    const pc =
      peers[watcherId];

    if (!pc) {

      debug(
        "Answer recebida sem PeerConnection."
      );

      return;
    }


    try {

      await pc.setRemoteDescription(
        new RTCSessionDescription(answer)
      );

      debug(
        "Remote description definida: " +
        watcherId
      );


    } catch (error) {

      console.error(error);

      debug(
        "Erro setRemoteDescription(answer): " +
        error.message
      );

    }

  }
);


/*
============================================================
CANDIDATE
============================================================
*/

socket.on(
  "candidate",
  async (watcherId, candidate) => {

    const pc =
      peers[watcherId];

    if (!pc) {

      debug(
        "Candidate sem PeerConnection."
      );

      return;
    }


    try {

      /*
        IMPORTANTE:
        Só adiciona candidate depois
        da remoteDescription.
      */

      if (!pc.remoteDescription) {

        debug(
          "Candidate recebido antes da remoteDescription."
        );

        return;
      }


      await pc.addIceCandidate(
        new RTCIceCandidate(candidate)
      );


    } catch (error) {

      console.error(error);

      debug(
        "Erro addIceCandidate: " +
        error.message
      );

    }

  }
);


/*
============================================================
WATCHER DESCONECTOU
============================================================
*/

socket.on(
  "disconnectPeer",
  watcherId => {

    const pc =
      peers[watcherId];

    if (pc) {

      pc.close();

      delete peers[watcherId];

    }

    updateViewerCount();

  }
);


/*
============================================================
BROADCASTER SUBSTITUÍDO
============================================================
*/

socket.on(
  "broadcaster-replaced",
  () => {

    setStatus(
      "Esta sala já possui outro transmissor."
    );

  }
);


/*
============================================================
PARAR
============================================================
*/

function stopShare() {

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => track.stop());

    localStream = null;

  }


  Object.values(peers)
    .forEach(pc => pc.close());


  for (const id in peers) {

    delete peers[id];

  }


  document.getElementById("preview")
    .srcObject = null;


  document.getElementById("startBtn")
    .style.display = "inline-block";

  document.getElementById("stopBtn")
    .style.display = "none";


  setStatus(
    "Transmissão parada."
  );


  updateViewerCount();

}


/*
============================================================
CONTADOR
============================================================
*/

function updateViewerCount() {

  document.getElementById("viewerCount")
    .textContent =
    `Espectadores conectados: ${
      Object.keys(peers).length
    }`;

}

</script>

</body>
</html>
